[package]
name = "rak"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
chromiumoxide = { version = "0.9", features = ["bytes"] }
crossterm = "0.28"
dirs = "6"
dotenvy = "0.15"
futures = "0.3"
htmd = "0.5"
jsonwebtoken = "9"
libc = "0.2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
